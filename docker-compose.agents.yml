# Multi-Agent Docker Compose for ZeroClaw
#
# Architecture:
#   - Each agent has its own subdirectory under .agents/ (e.g., .agents/handy/)
#   - Agent config: .agents/<agent>/.env (environment variables)
#   - Agent identity: .agents/<agent>/*.md files
#   - Agent tools: .agents/<agent>/tools/ (optional, mounted to /usr/local/bin/agent-tools)
#
# Per-Agent Tool Customization (no custom Dockerfile needed!):
#   All agents share the same base image, but each can have different tools:
#
#   1. Add custom tools to .agents/<agent>/tools/
#      These are automatically mounted and available as: agent-tools/<tool-name>
#
#   2. Install APT packages via environment:
#      AGENT_APT_PACKAGES="kubectl helm awscli" in .agents/<agent>/.env
#      (installed at container startup, cached on restart)
#
#   3. Install NPM packages via environment:
#      AGENT_NPM_PACKAGES="@anthropic-ai/sdk typescript ts-node" in .agents/<agent>/.env
#      (installed at container startup, cached on restart)
#
#   4. Download remote tools via environment:
#      AGENT_TOOLS="https://example.com/my-tool" in .agents/<agent>/.env
#
#   Example .env for a DevOps agent:
#     AGENT_APT_PACKAGES="kubectl helm jq"
#     AGENT_NPM_PACKAGES="@anthropic-ai/sdk"
#     AGENT_CONFIG_DIR=/agent-config
#
#   Why this approach? No need to maintain separate Dockerfiles for each agent!
#   - Single base image = easier updates
#   - Per-agent packages = flexibility
#   - Cached installations = fast restarts
#
# Usage:
#   docker compose -f docker-compose.agents.yml --profile handy up -d
#   docker compose -f docker-compose.agents.yml --profile gordon up -d
#   docker compose -f docker-compose.agents.yml --profile zoe up -d
#
# Or create new agents:
#   ./scripts/agent.sh create mybot
#   docker compose -f docker-compose.agents.yml --profile mybot up -d
#
# Container names will be auto-generated like: zeroclaw-handy-1

name: zeroclaw

x-agent-base: &agent-base
  build:
    context: .
    target: dev
  restart: unless-stopped
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - net_admin
  healthcheck:
    test: ["CMD", "zeroclaw", "doctor"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  # ============================================================================
  # Pre-configured Agents
  # ============================================================================
  # Each agent has:
  #   - A profile name (handy, gordon, zoe)
  #   - A specific port mapping
  #   - A bind mount for the agent's config directory
  #
  # Docker Compose automatically:
  #   - Names containers like: zeroclaw-handy-1, zeroclaw-gordon-1
  #   - Creates isolated volumes per service
  #   - Manages all networking
  #
  # To add a new agent, copy one of these services and change:
  #   - service name (e.g., myagent:)
  #   - profile name (e.g., profiles: [myagent])
  #   - config directory: ./.agents/myagent:/agent-config:ro
  #   - env file: .agents/myagent/.env
  #   - tools directory (optional): ./.agents/myagent/tools:/usr/local/bin/agent-tools
  #
  # For custom images per agent, replace <<: *agent-base with:
  #   image: your-custom-image:tag
  #   # OR build:
  #   # build:
  #   #   context: .
  #   #   dockerfile: .agents/myagent/Dockerfile
  # ============================================================================
  
  handy:
    <<: *agent-base
    profiles: [handy]
    env_file:
      - .agents/.shared.env
      - .agents/handy/.env
    environment:
      - ZEROCLAW_GATEWAY_PORT=3000
      - ZEROCLAW_LITESTREAM_ENABLED=true
      - AGENT_CONFIG_DIR=/agent-config
    # No host ports exposed - agents use Tailscale for secure networking
    volumes:
      - data:/zeroclaw-data
      - tailscale:/var/lib/tailscale
      - type: bind
        source: ./.agents/handy
        target: /agent-config
        read_only: true
      # Optional: mount agent-specific tools/scripts
      - type: bind
        source: ./.agents/handy/tools
        target: /usr/local/bin/agent-tools
        read_only: true
    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

  gordon:
    <<: *agent-base
    profiles: [gordon]
    env_file:
      - .agents/.shared.env
      - .agents/gordon/.env
    environment:
      - ZEROCLAW_GATEWAY_PORT=3000
      - ZEROCLAW_LITESTREAM_ENABLED=true
      - AGENT_CONFIG_DIR=/agent-config
    # No host ports exposed - agents use Tailscale for secure networking
    volumes:
      - data:/zeroclaw-data
      - tailscale:/var/lib/tailscale
      - type: bind
        source: ./.agents/gordon
        target: /agent-config
        read_only: true
      # Optional: mount agent-specific tools/scripts
      - type: bind
        source: ./.agents/gordon/tools
        target: /usr/local/bin/agent-tools
        read_only: true
    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

  zoe:
    <<: *agent-base
    profiles: [zoe]
    env_file:
      - .agents/.shared.env
      - .agents/zoe/.env
    environment:
      - ZEROCLAW_GATEWAY_PORT=3000
      - ZEROCLAW_LITESTREAM_ENABLED=true
      - AGENT_CONFIG_DIR=/agent-config
    # No host ports exposed - agents use Tailscale for secure networking
    volumes:
      - data:/zeroclaw-data
      - tailscale:/var/lib/tailscale
      - type: bind
        source: ./.agents/zoe
        target: /agent-config
        read_only: true
      # Optional: mount agent-specific tools/scripts
      - type: bind
        source: ./.agents/zoe/tools
        target: /usr/local/bin/agent-tools
        read_only: true
    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

volumes:
  # Anonymous volumes - Docker Compose creates isolated ones per profile
  data:
  tailscale:
