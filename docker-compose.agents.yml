# Multi-Agent Docker Compose for ZeroClaw
#
# Architecture:
#   - Each agent has its own subdirectory under .agents/ (e.g., .agents/handy/)
#   - Agent config: .agents/<agent>/.env (environment variables)
#   - Agent identity: .agents/<agent>/*.md files
#   - Agent tools manifest: .agents/<agent>/tools.toml (resolved at build time)
#
# Per-Agent Tool Customization (immutable per-image):
#   Each agent builds from the same Dockerfile with AGENT_NAME set.
#
#   1. Declare custom tools in .agents/<agent>/tools.toml
#      Run ./scripts/agent.sh start <agent> to resolve and bake them into image
#
#   2. Install APT packages in tools.toml:
#      [apt]
#      packages = ["kubectl", "helm", "awscli"]
#
#   3. Install npm CLI tools via Bun in tools.toml:
#      [bun]
#      packages = ["typescript", "tsx", "@anthropic-ai/sdk"]
#
#   Why this approach?
#   - Agent images are immutable and portable to remote hosts
#   - Only explicitly installed tools are present per agent image
#   - No runtime dependency on mounted tool directories
#
# Usage:
#   docker compose -f docker-compose.agents.yml --profile handy up -d
#   docker compose -f docker-compose.agents.yml --profile gordon up -d
#   docker compose -f docker-compose.agents.yml --profile zoe up -d
#   docker compose -f docker-compose.agents.yml --profile dwayne up -d
#
# Or create new agents:
#   ./scripts/agent.sh create mybot
#   docker compose -f docker-compose.agents.yml --profile mybot up -d
#
# Container names will be auto-generated like: zeroclaw-handy-1

name: zeroclaw

x-agent-base: &agent-base
  build:
    context: .
    target: dev
    args:
      AGENT_NAME: _default
  restart: unless-stopped
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - net_admin
  healthcheck:
    test: ["CMD", "zeroclaw", "doctor"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  # ============================================================================
  # Pre-configured Agents
  # ============================================================================
  # Each agent has:
  #   - A profile name (handy, gordon, zoe, dwayne)
  #   - Internal gateway on :3000 (accessed via per-agent Tailscale domain)
  #   - A bind mount for the agent's config directory
  #
  # Docker Compose automatically:
  #   - Names containers like: zeroclaw-handy-1, zeroclaw-gordon-1
  #   - Creates isolated volumes per service
  #   - Manages all networking
  #
  # To add a new agent, copy one of these services and change:
  #   - service name (e.g., myagent:)
  #   - profile name (e.g., profiles: [myagent])
  #   - config directory: ./.agents/myagent:/agent-config:ro
  #   - env file: .agents/myagent/.env
  #   - build arg AGENT_NAME: myagent
  #
  # For custom images per agent, replace <<: *agent-base with:
  #   image: your-custom-image:tag
  #   # OR build:
  #   # build:
  #   #   context: .
  #   #   dockerfile: .agents/myagent/Dockerfile
  # ============================================================================
  
  handy:
    <<: *agent-base
    build:
      context: .
      target: dev
      args:
        AGENT_NAME: handy
    profiles: [handy]
    env_file:
      - .agents/.shared.env
      - .agents/handy/.env
    environment:
      - ZEROCLAW_GATEWAY_PORT=3000
      - ZEROCLAW_LITESTREAM_ENABLED=true
      - AGENT_CONFIG_DIR=/agent-config
    # No host ports exposed - agents use Tailscale for secure networking
    volumes:
      - data:/zeroclaw-data
      - tailscale:/var/lib/tailscale
      - type: bind
        source: ./.agents/handy
        target: /agent-config
        read_only: true
    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

  gordon:
    <<: *agent-base
    build:
      context: .
      target: dev
      args:
        AGENT_NAME: gordon
    profiles: [gordon]
    env_file:
      - .agents/.shared.env
      - .agents/gordon/.env
    environment:
      - ZEROCLAW_GATEWAY_PORT=3000
      - ZEROCLAW_LITESTREAM_ENABLED=true
      - AGENT_CONFIG_DIR=/agent-config
    # No host ports exposed - agents use Tailscale for secure networking
    volumes:
      - data:/zeroclaw-data
      - tailscale:/var/lib/tailscale
      - type: bind
        source: ./.agents/gordon
        target: /agent-config
        read_only: true
    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

  zoe:
    <<: *agent-base
    build:
      context: .
      target: dev
      args:
        AGENT_NAME: zoe
    profiles: [zoe]
    env_file:
      - .agents/.shared.env
      - .agents/zoe/.env
    environment:
      - ZEROCLAW_GATEWAY_PORT=3000
      - ZEROCLAW_LITESTREAM_ENABLED=true
      - AGENT_CONFIG_DIR=/agent-config
    # No host ports exposed - agents use Tailscale for secure networking
    volumes:
      - data:/zeroclaw-data
      - tailscale:/var/lib/tailscale
      - type: bind
        source: ./.agents/zoe
        target: /agent-config
        read_only: true
    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

  dwayne:
    <<: *agent-base
    build:
      context: .
      target: dev
      args:
        AGENT_NAME: dwayne
    profiles: [dwayne]
    env_file:
      - .agents/.shared.env
      - .agents/dwayne/.env
    environment:
      - ZEROCLAW_GATEWAY_PORT=3000
      - ZEROCLAW_LITESTREAM_ENABLED=true
      - AGENT_CONFIG_DIR=/agent-config
    # No host ports exposed - agents use Tailscale for secure networking
    volumes:
      - data:/zeroclaw-data
      - tailscale:/var/lib/tailscale
      - type: bind
        source: ./.agents/dwayne
        target: /agent-config
        read_only: true
    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

volumes:
  # Anonymous volumes - Docker Compose creates isolated ones per profile
  data:
  tailscale:
