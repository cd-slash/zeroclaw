[autonomy]
level = "full"
workspace_only = true
allowed_commands = ["bash", "bun", "cargo", "cat", "date", "echo", "find", "git", "grep", "gws", "head", "ls", "node", "npm", "pwd", "tail", "wc", "pngx"]
forbidden_paths = ["/etc", "/root", "/home", "/usr", "/bin", "/sbin", "/lib", "/opt", "/boot", "/dev", "/proc", "/sys", "/var", "/tmp", "~/.ssh", "~/.gnupg", "~/.aws", "~/.config"]
max_actions_per_hour = 20
max_cost_per_day_cents = 500
require_approval_for_medium_risk = true
block_high_risk_commands = true
shell_env_passthrough = ["GOOGLE_WORKSPACE_CLI_TOKEN", "GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE", "GOOGLE_WORKSPACE_CLI_CLIENT_ID", "GOOGLE_WORKSPACE_CLI_CLIENT_SECRET", "GOOGLE_WORKSPACE_CLI_CONFIG_DIR", "GOOGLE_WORKSPACE_PROJECT_ID"]
auto_approve = ["file_read", "memory_recall"]
always_ask = []
allowed_roots = []
non_cli_excluded_tools = []
