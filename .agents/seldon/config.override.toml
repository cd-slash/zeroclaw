[autonomy]
level = "full"
workspace_only = false
forbidden_paths = []
max_actions_per_hour = 100
max_cost_per_day_cents = 1000
shell_env_passthrough = ["PLAYWRITER_HOST", "PLAYWRITER_TOKEN"]
allowed_commands = ["bash", "bun", "cargo", "cat", "date", "echo", "find", "git", "grep", "head", "ls", "node", "npm", "pwd", "playwriter", "python3", "pip3", "pip", "python", "tail", "vdirsyncer", "vdirsyncer-oauth-setup", "wc"]
