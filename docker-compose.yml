# ZeroClaw Docker Compose Example
# 
# Quick start:
#   1. Copy this file and set your API key
#   2. Run: docker compose up -d
#   3. Access gateway at http://localhost:42617
#
# For more info: https://github.com/zeroclaw-labs/zeroclaw

services:
  zeroclaw:
    # image: ghcr.io/zeroclaw-labs/zeroclaw:latest
    # Build locally (dev image includes Tailscale support):
    build:
      context: .
      target: dev
      args:
        AGENT_NAME: ${AGENT_NAME:-_default}
    # Match runtime hostname to the agent's Tailscale hostname setting.
    hostname: ${TAILSCALE_HOSTNAME:-${AGENT_NAME:-zeroclaw}}
    restart: unless-stopped

    env_file:
      - ${SHARED_ENV_FILE:-.agents/.shared.env}
      - ${AGENT_ENV_FILE:-.env}

    environment:
      - ZEROCLAW_GATEWAY_PORT=${ZEROCLAW_GATEWAY_PORT:-3000}
      - ZEROCLAW_LITESTREAM_ENABLED=${ZEROCLAW_LITESTREAM_ENABLED:-true}
      - ZEROCLAW_AUTO_START_CHANNELS=${ZEROCLAW_AUTO_START_CHANNELS:-true}
      - AGENT_CONFIG_DIR=/agent-config

    volumes:
      # Persist workspace and config (must match WORKDIR/HOME in Dockerfile)
      - zeroclaw-data:/zeroclaw-data
      # Persist Tailscale state
      - tailscale-data:/var/lib/tailscale
    
    # No host ports exposed - use Tailscale for secure networking
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Required for Tailscale VPN:
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin

    # Health check
    healthcheck:
      test: ["CMD", "zeroclaw", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

volumes:
  zeroclaw-data:
  tailscale-data:
