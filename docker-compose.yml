# ZeroClaw Docker Compose Example
# 
# Quick start:
#   1. Copy this file and set your API key
#   2. Run: docker compose up -d
#   3. Access gateway at http://localhost:42617
#
# For more info: https://github.com/zeroclaw-labs/zeroclaw

services:
  zeroclaw:
    image: ghcr.io/zeroclaw-labs/zeroclaw:latest
    # Or build locally:
    # build: .
    container_name: zeroclaw
    restart: unless-stopped
    
    # Load all environment variables from .env file
    # The entrypoint will auto-sync ZEROCLAW_* variables to config.toml
    env_file:
      - .env
    
    # Only map specific vars needed at compose-level (hostname, ports)
    environment:
      # These are used by docker-compose itself (not just the container)
      - HOSTNAME=${HOSTNAME:-zeroclaw}
      - HOST_PORT=${HOST_PORT:-3000}
    
    volumes:
      # Persist workspace and config (must match WORKDIR/HOME in Dockerfile)
      - zeroclaw-data:/zeroclaw-data
      # Persist Tailscale state
      - tailscale-data:/var/lib/tailscale
    
    # No host ports exposed - use Tailscale for secure networking
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check — uses lightweight status instead of full diagnostics.
    # For images with curl, prefer: curl -f http://localhost:42617/health
    healthcheck:
      test: ["CMD", "zeroclaw", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  zeroclaw-data:
  tailscale-data:
