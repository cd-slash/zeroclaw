# ZeroClaw Docker Compose Example
# 
# Quick start:
#   1. Copy this file and set your API key
#   2. Run: docker-compose up -d
#   3. Access gateway at http://localhost:3000
#
# For more info: https://github.com/theonlyhennygod/zeroclaw

services:
  zeroclaw:
    # image: ghcr.io/theonlyhennygod/zeroclaw:latest
    # Build locally (dev image includes Tailscale support):
    build:
      context: .
      target: dev
    # Container name and hostname are aligned via HOSTNAME env var
    container_name: ${HOSTNAME:-zeroclaw}
    hostname: ${HOSTNAME:-zeroclaw}
    restart: unless-stopped
    
    # Load all environment variables from .env file
    # The entrypoint will auto-sync ZEROCLAW_* variables to config.toml
    env_file:
      - .env
    
    # Only map specific vars needed at compose-level (hostname, ports)
    environment:
      # These are used by docker-compose itself (not just the container)
      - HOSTNAME=${HOSTNAME:-zeroclaw}
      - HOST_PORT=${HOST_PORT:-3000}
    
    volumes:
      # Persist workspace and config (must match WORKDIR/HOME in Dockerfile)
      - zeroclaw-data:/zeroclaw-data
      # Persist Tailscale state
      - tailscale-data:/var/lib/tailscale
    
    # No host ports exposed - use Tailscale for secure networking
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Required for Tailscale VPN:
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    
    # Health check
    healthcheck:
      test: ["CMD", "zeroclaw", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  zeroclaw-data:
  tailscale-data:
