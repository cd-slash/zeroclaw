# ZeroClaw Docker Compose Example
# 
# Quick start:
#   1. Copy this file and set your API key
#   2. Run: docker-compose up -d
#   3. Access gateway at http://localhost:3000
#
# For more info: https://github.com/theonlyhennygod/zeroclaw

services:
  zeroclaw:
    image: ghcr.io/theonlyhennygod/zeroclaw:latest
    # Or build locally (dev image includes Tailscale support):
    # build:
    #   context: .
    #   target: dev
    container_name: zeroclaw
    restart: unless-stopped
    
    environment:
      # Required: Your LLM provider API key
      - API_KEY=${API_KEY:-}
      # Or use the prefixed version:
      # - ZEROCLAW_API_KEY=${ZEROCLAW_API_KEY:-}
      
      # Optional: LLM provider (default: openrouter)
      # Options: openrouter, openai, anthropic, ollama
      - PROVIDER=${PROVIDER:-openrouter}
      
      # Optional: Model override
      # - ZEROCLAW_MODEL=anthropic/claude-sonnet-4-20250514
      
      # Optional: Tailscale authentication (when using tailscale build target)
      # Get auth key from: https://login.tailscale.com/admin/settings/keys
      # - TAILSCALE_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      # - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME:-zeroclaw}
      
    volumes:
      # Persist workspace and config
      - zeroclaw-data:/data
      # Persist Tailscale state (when using tailscale build target)
      # - tailscale-data:/var/lib/tailscale
      
    ports:
      # Gateway API port
      - "3000:3000"
    
    # Uncomment when using tailscale build target:
    # devices:
    #   - /dev/net/tun:/dev/net/tun
    # cap_add:
    #   - net_admin
    
    # Health check
    healthcheck:
      test: ["CMD", "zeroclaw", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  zeroclaw-data:
  # Uncomment when using tailscale build target:
  # tailscale-data:
