# ZeroClaw generic single-agent compose stack.
#
# This file defines one service (`server`) and relies on environment interpolation.
# Use a unique compose project (`-p zeroclaw-<agent>`) per agent to isolate:
# - container names
# - networks
# - volumes

services:
  server:
    build:
      context: .
      target: dev
      args:
        AGENT_NAME: ${AGENT_NAME:-_default}

    hostname: ${TAILSCALE_HOSTNAME:-${AGENT_NAME:-zeroclaw}}
    restart: unless-stopped

    env_file:
      - ${SHARED_ENV_FILE:-.agents/.shared.env}
      - ${AGENT_ENV_FILE:-.env}

    environment:
      - ZEROCLAW_GATEWAY_PORT=${ZEROCLAW_GATEWAY_PORT:-3000}
      - ZEROCLAW_LITESTREAM_ENABLED=${ZEROCLAW_LITESTREAM_ENABLED:-true}
      - ZEROCLAW_AUTO_START_CHANNELS=${ZEROCLAW_AUTO_START_CHANNELS:-true}
      - AGENT_CONFIG_DIR=/agent-config

    volumes:
      - data:/zeroclaw-data
      - tailscale:/var/lib/tailscale
      - type: bind
        source: ${AGENT_CONFIG_DIR_SOURCE:-./.agents/${AGENT_NAME}}
        target: /agent-config
        read_only: true

    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin

    healthcheck:
      test: ["CMD", "zeroclaw", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    command: ["start-agent-with-litestream.sh", "gateway", "--port", "3000", "--host", "[::]"]

volumes:
  data:
  tailscale:
